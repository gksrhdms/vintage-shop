{% extends 'base.html' %}
{% block title %}로그인 · VINTAGE SHOP{% endblock %}

{% block content %}
<h1 style="font-weight:500; letter-spacing:-0.01em;">LOGIN</h1>
<div style="max-width:360px;">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">로그인</button>
    </form>
    <p style="margin-top:16px; font-size:13px;">
        계정이 없으신가요? <a href="{% url 'accounts:signup' %}" style="text-decoration:underline;">회원가입</a>
    </p>
</div>
{% endblock %}
